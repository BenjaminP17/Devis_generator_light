<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Devis</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6', // blue-500
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- LATERALE GAUCHE : ÉDITION -->
    <aside class="w-full md:w-1/3 max-w-md bg-white border-r border-slate-200 h-full flex flex-col shadow-sm z-10 relative">
        <header class="p-6 border-b border-slate-100 flex items-center justify-between bg-white z-10 sticky top-0">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">DevisMaker</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-6 space-y-8 pb-32">
            <!-- Emetteur -->
            <section class="space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">I. Informations Émetteur</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Nom / Société</label>
                        <input type="text" id="input-sender-name" class="editor-input w-full" placeholder="Ex: Acme Corp">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Adresse</label>
                        <textarea id="input-sender-address" class="editor-input w-full h-20 resize-none" placeholder="123 rue de la Paix&#10;75000 Paris"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">SIRET / Info légale</label>
                        <input type="text" id="input-sender-siret" class="editor-input w-full" placeholder="SIRET : 123 456 789 00012">
                    </div>
                </div>
            </section>

            <!-- Client -->
            <section class="space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">II. Informations Client</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Nom / Société du client</label>
                        <input type="text" id="input-client-name" class="editor-input w-full" placeholder="Ex: Globex Inc">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Adresse du client</label>
                        <textarea id="input-client-address" class="editor-input w-full h-20 resize-none" placeholder="456 avenue des Champs&#10;75008 Paris"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Date du devis</label>
                        <input type="date" id="input-quote-date" class="editor-input w-full">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Numéro de devis</label>
                        <input type="text" id="input-quote-number" class="editor-input w-full" placeholder="Ex: DEV-2026-001">
                    </div>
                </div>
            </section>

            <!-- Lignes de Devis -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">III. Articles</h2>
                </div>
                
                <div id="items-container" class="space-y-3">
                    <!-- Les lignes seront générées ici par JS -->
                </div>
                
                <button type="button" id="btn-add-item" class="w-full py-2 px-4 border-2 border-dashed border-slate-200 text-slate-500 rounded-xl hover:border-blue-400 hover:text-blue-500 transition-colors flex items-center justify-center gap-2 text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Ajouter une ligne
                </button>
            </section>

            <!-- Paramètres et Totaux -->
            <section class="space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">IV. Récapitulatif</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Taux de TVA (%)</label>
                    <input type="number" id="input-tax-rate" value="20" class="editor-input w-full" min="0" step="0.1">
                </div>
            </section>
        </div>

        <!-- Sticky Footer for Actions -->
        <div class="p-4 border-t border-slate-200 bg-white sticky bottom-0 z-10 w-full mt-auto">
            <button id="btn-generate-pdf" class="w-full bg-slate-900 hover:bg-black text-white font-medium py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Générer le PDF
            </button>
        </div>
    </aside>

    <!-- LATERALE DROITE : PRÉVISUALISATION -->
    <main class="w-full md:w-2/3 h-full bg-slate-100 overflow-y-auto p-4 md:p-8 flex justify-center items-start">
        
        <!-- Document A4 Wrapper (Scale responsive logic via CSS) -->
        <div class="a4-wrapper shadow-2xl bg-white w-full max-w-[794px] min-h-[1123px] relative flex flex-col shrink-0" id="invoice-preview">
            
            <!-- Padding interne du document imprimable -->
            <div class="p-10 md:p-14 flex-1 flex flex-col">
                
                <!-- HEADER -->
                <header class="flex justify-between items-start mb-16">
                    <!-- Logo / Émetteur -->
                    <div class="flex flex-col gap-4">
                        <img id="preview-logo" src="" alt="Logo" class="h-16 w-auto object-contain hidden">
                        <div class="text-sm">
                            <div id="preview-sender-name" class="font-bold text-lg text-slate-800"></div>
                            <div id="preview-sender-address" class="text-slate-600 whitespace-pre-wrap mt-1"></div>
                        </div>
                    </div>
                    
                    <!-- Devis Titre & Date -->
                    <div class="text-right">
                        <h1 class="text-4xl font-light text-slate-300 tracking-wider uppercase mb-4">Devis</h1>
                        <div class="text-sm text-slate-600">
                            <p class="mb-1"><strong>N°: </strong><span id="preview-quote-number"></span></p>
                            <p><strong>Date : </strong><span id="preview-quote-date"></span></p>
                        </div>
                    </div>
                </header>

                <!-- CLIENT SECTION -->
                <section class="mb-16 grid grid-cols-2">
                    <div></div> <!-- Empty for spacing left side -->
                    <div class="bg-slate-50 p-6 rounded-lg border border-slate-100">
                        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Adressé à</h3>
                        <div id="preview-client-name" class="font-bold text-slate-800 text-lg"></div>
                        <div id="preview-client-address" class="text-slate-600 whitespace-pre-wrap mt-1 text-sm"></div>
                    </div>
                </section>

                <!-- TABLE ITEMS -->
                <section class="flex-1">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-y border-slate-200">
                            <tr>
                                <th scope="col" class="py-3 px-4 w-1/2">Désignation</th>
                                <th scope="col" class="py-3 px-4 text-center">Qté</th>
                                <th scope="col" class="py-3 px-4 text-right">Prix Unitaire</th>
                                <th scope="col" class="py-3 px-4 text-right">Total HT</th>
                            </tr>
                        </thead>
                        <tbody id="preview-items-body" class="divide-y divide-slate-100">
                            <!-- Injected rows -->
                        </tbody>
                    </table>
                </section>

                <!-- TOTALS -->
                <section class="mt-12 flex justify-end">
                    <div class="w-1/2 md:w-2/5">
                        <div class="flex justify-between py-2 text-sm text-slate-600">
                            <span>Total HT</span>
                            <span id="preview-total-ht" class="font-medium text-slate-800">0.00 €</span>
                        </div>
                        <div class="flex justify-between py-2 text-sm text-slate-600 border-b border-slate-200">
                            <span>TVA (<span id="preview-tax-rate-display">20</span>%)</span>
                            <span id="preview-tax-amount" class="font-medium text-slate-800">0.00 €</span>
                        </div>
                        <div class="flex justify-between py-3 text-lg font-bold text-slate-900">
                            <span>Total TTC</span>
                            <span id="preview-total-ttc">0.00 €</span>
                        </div>
                    </div>
                </section>

                <!-- FOOTER / SIRET -->
                <footer class="mt-16 pt-8 border-t border-slate-100 text-center text-xs text-slate-400">
                    <p id="preview-sender-siret"></p>
                </footer>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
